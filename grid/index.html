</style></head> <body> <div class="container"> <header class="header"> <div class="header-content"> <div> <div class="site-title">Astro Girija</div> <div class="site-url">astrogirija.in</div> </div> </div> </header> <main class="main-content">   <div id="gridContent"> <div class="grid-card"> <div class="no-data"> <div class="no-data-icon">📊</div> <h3>Enter Your Date of Birth</h3> <p>To generate your Lo Shu Grid, please enter your date of birth on the home page.</p> <a href="/numero-girija/" class="btn">Go to Home</a> </div> </div> </div> <script>(function(){const base = "/numero-girija/";

        // Load loshu-utils.js
        const utilsScript = document.createElement('script');
        utilsScript.src = base + 'loshu-utils.js';
        document.head.appendChild(utilsScript);

        utilsScript.onload = function() {
            const dob = sessionStorage.getItem('userDOB');

            if (dob) {
                const data = calculateLoShuChart(dob);

            let html = `
                <div class="grid-card">
                    <h2 class="section-title">Your Key Numbers</h2>
                    <div class="key-numbers">
                        <div class="key-box">
                            <div class="key-label">Driver Number</div>
                            <div class="key-value">${data.driver}</div>
                        </div>
                        <div class="key-box">
                            <div class="key-label">Conductor Number</div>
                            <div class="key-value">${data.conductor}</div>
                        </div>
                    </div>
                </div>

                <div class="grid-card">
                    <h2 class="section-title">Your Lo Shu Grid</h2>
                    <div class="loshu-grid">
            `;

            // Traditional Lo Shu Grid arrangement (magic square)
            const gridLayout = [
                [4, 9, 2],  // Top row
                [3, 5, 7],  // Middle row
                [8, 1, 6]   // Bottom row
            ];

            gridLayout.forEach(row => {
                row.forEach(pos => {
                    const numbersInCell = data.grid[pos] || [];
                    const hasNumbers = numbersInCell.length > 0;

                    html += `
                        <div class="loshu-cell ${hasNumbers ? 'has-numbers' : ''}">
                            <div class="cell-number">${pos}</div>
                            <div class="cell-digits">
                                ${numbersInCell.length > 0 ? numbersInCell.join(' ') : '–'}
                            </div>
                        </div>
                    `;
                });
            });

            html += `
                    </div>
                </div>

                <div class="grid-card">
                    <h2 class="section-title">Number Frequency</h2>
                    <div class="frequency-list">
            `;

            for (let num = 1; num <= 9; num++) {
                const count = data.frequency[num] || 0;
                html += `
                    <div class="frequency-item">
                        <div class="frequency-number">${num}</div>
                        <div class="frequency-count">${count}x</div>
                    </div>
                `;
            }

            html += `
                    </div>
                </div>

                <div class="grid-card">
                    <h2 class="section-title">Chart Information</h2>
                    <div class="info-section">
                        <div class="info-row">
                            <span class="info-label">Date of Birth</span>
                            <span class="info-value">${dob}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Driver Number</span>
                            <span class="info-value">${data.driver} (${getPlanetName(data.driver)})</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Conductor Number</span>
                            <span class="info-value">${data.conductor} (${getPlanetName(data.conductor)})</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Personal Year 2026</span>
                            <span class="info-value">${calculatePersonalYear(data.day, data.month, calculateUniversalYear(2026))}</span>
                        </div>
                    </div>

                    <h3 style="font-size: 1.1rem; font-weight: 500; color: #1a1a1a; margin-top: 28px; margin-bottom: 12px;">Missing Numbers</h3>
                    <div class="missing-numbers">
            `;

            for (let num = 1; num <= 9; num++) {
                if (!data.frequency[num]) {
                    html += `<div class="missing-badge">${num}</div>`;
                }
            }

            html += `
                    </div>
                </div>
            `;

            document.getElementById('gridContent').innerHTML = html;
            }
        };
    })();</script>  </main> <nav class="bottom-nav"> <div class="nav-items"> <a href="/numero-girija/" class="nav-item"> <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"> <path d="M10 3L2 10h2v7h4v-5h4v5h4v-7h2L10 3z"></path> </svg> <span class="nav-text" data-translate="nav.home">Home</span> </a> <a href="/numero-girija/grid/" class="nav-item"> <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"> <path d="M3 3h5v5H3V3zm0 7h5v5H3v-5zm7-7h5v5h-5V3zm0 7h5v5h-5v-5z"></path> </svg> <span class="nav-text" data-translate="nav.grid">Grid</span> </a> <a href="/numero-girija/learn/" class="nav-item"> <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"> <path d="M10 2L2 6v4c0 4.5 3.5 8 8 8s8-3.5 8-8V6l-8-4zm0 14c-3.3 0-6-2.7-6-6V7l6-3 6 3v3c0 3.3-2.7 6-6 6z"></path> </svg> <span class="nav-text" data-translate="nav.learn">Learn</span> </a> <a href="/numero-girija/compatibility/" class="nav-item"> <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"> <path d="M10 17l-5-5h3V4h4v8h3l-5 5zM3 3h14v2H3V3z"></path> </svg> <span class="nav-text" data-translate="nav.match">Match</span> </a> <a href="/numero-girija/more/" class="nav-item"> <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"> <path d="M3 6h14v2H3V6zm0 4h14v2H3v-2zm0 4h14v2H3v-2z"></path> </svg> <span class="nav-text" data-translate="nav.more">More</span> </a> </div> </nav> </div> <script>(function(){const base = "/numero-girija/";
